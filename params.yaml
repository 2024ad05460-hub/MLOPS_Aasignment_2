data:
  raw_dir: data/raw/dog-and-cat-classification-dataset/PetImages
  processed_dir: data/processed
  image_size: 224
  train_ratio: 0.80
  validation_ratio: 0.10
  seed: 42
  max_per_class: null

training:
  architecture: mobilenet_v3_small
  pretrained: true
  freeze_backbone: false
  epochs: 15
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  seed: 42