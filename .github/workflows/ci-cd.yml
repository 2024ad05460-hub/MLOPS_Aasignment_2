name: CI-CD Cats Dogs MLOps

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cats-dogs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker and GHCR image repository names must be lowercase.
  IMAGE_NAME: ghcr.io/2024ad05460-hub/mlops_aasignment_2

jobs:
  # ==========================================================
  # M3 — Continuous Integration
  # ==========================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps -e .

      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check src tests

      - name: Unit and API tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            --junitxml=pytest-report.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: error
          retention-days: 14

  # ==========================================================
  # M3 — Docker image build and artifact publishing
  # ==========================================================
  build-and-publish:
    name: Build and Publish
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_sha: ${{ steps.image.outputs.image_sha }}
      image_latest: ${{ steps.image.outputs.image_latest }}

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Download Git LFS model artifact
        shell: bash
        run: |
          set -euo pipefail

          git lfs install
          git lfs pull
          git lfs checkout

          echo "Git LFS tracked files:"
          git lfs ls-files

          echo "Model file information:"
          ls -lh models/model.pt

      - name: Set up Python for model validation
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch for model validation
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            torch==2.11.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Validate model artifact
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import torch

          model_path = Path("models/model.pt")

          if not model_path.exists():
              raise SystemExit(
                  "ERROR: models/model.pt does not exist."
              )

          model_bytes = model_path.read_bytes()

          lfs_pointer_header = (
              b"version https://git-lfs.github.com/spec"
          )

          if model_bytes.startswith(lfs_pointer_header):
              raise SystemExit(
                  "ERROR: models/model.pt is still an unresolved "
                  "Git LFS pointer."
              )

          if len(model_bytes) < 100_000:
              raise SystemExit(
                  "ERROR: models/model.pt is unexpectedly small: "
                  f"{len(model_bytes):,} bytes."
              )

          payload = torch.load(
              model_path,
              map_location="cpu",
              weights_only=False,
          )

          if not isinstance(payload, dict):
              raise SystemExit(
                  "ERROR: Model artifact is not a dictionary bundle."
              )

          required_keys = {
              "state_dict",
              "architecture",
              "class_names",
              "image_size",
          }

          missing_keys = required_keys.difference(payload.keys())

          if missing_keys:
              raise SystemExit(
                  "ERROR: Model bundle is missing required keys: "
                  f"{sorted(missing_keys)}"
              )

          architecture = payload["architecture"]
          class_names = payload["class_names"]
          image_size = payload["image_size"]

          if architecture != "mobilenet_v3_small":
              raise SystemExit(
                  "ERROR: Unexpected model architecture: "
                  f"{architecture}"
              )

          if class_names != ["cat", "dog"]:
              raise SystemExit(
                  "ERROR: Unexpected model classes: "
                  f"{class_names}"
              )

          print("Model artifact validation passed.")
          print(f"Size: {len(model_bytes):,} bytes")
          print(f"Architecture: {architecture}")
          print(f"Classes: {class_names}")
          print(f"Image size: {image_size}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image references
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_SHA="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          IMAGE_LATEST="${IMAGE_NAME}:latest"

          echo "image_sha=${IMAGE_SHA}" \
            >> "${GITHUB_OUTPUT}"

          echo "image_latest=${IMAGE_LATEST}" \
            >> "${GITHUB_OUTPUT}"

          echo "SHA image: ${IMAGE_SHA}"
          echo "Latest image: ${IMAGE_LATEST}"

      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}

          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          labels: |
            org.opencontainers.image.title=Cats Dogs MLOps API
            org.opencontainers.image.description=MobileNetV3 cats-versus-dogs inference service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}

      - name: Build and optionally publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ==========================================================
  # M4 — Temporary deployment and smoke testing
  # ==========================================================
  deploy-and-smoke-test:
    name: Deploy and Smoke Test
    needs: build-and-publish

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy published image
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.build-and-publish.outputs.image_latest }}

        run: |
          set -euo pipefail

          echo "Deploying image: ${IMAGE_NAME}"

          docker compose \
            -f deployment/docker-compose.ci.yml \
            pull

          docker compose \
            -f deployment/docker-compose.ci.yml \
            up -d

          echo "Docker Compose status:"

          docker compose \
            -f deployment/docker-compose.ci.yml \
            ps

      - name: Wait for health endpoint
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.build-and-publish.outputs.image_latest }}

        run: |
          set -euo pipefail

          for attempt in $(seq 1 40); do
            echo "Health-check attempt ${attempt}/40"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:8000/health; then

              echo
              echo "API health check passed."
              exit 0
            fi

            sleep 3
          done

          echo "ERROR: API did not become healthy."

          docker compose \
            -f deployment/docker-compose.ci.yml \
            ps

          docker compose \
            -f deployment/docker-compose.ci.yml \
            logs

          exit 1

      - name: Install smoke-test dependency
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install requests==2.32.5

      - name: Run post-deployment smoke test
        shell: bash
        env:
          PYTHONPATH: src

        run: |
          set -euo pipefail

          python -m cats_dogs_mlops.smoke_test \
            --base-url http://localhost:8000 \
            --image tests/assets/cat_demo.png \
            | tee smoke-test-output.json

      - name: Verify Prometheus metrics endpoint
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            http://localhost:8000/metrics \
            > prometheus-metrics.txt

          grep \
            "cats_dogs_requests_total" \
            prometheus-metrics.txt

          grep \
            "cats_dogs_request_latency_seconds" \
            prometheus-metrics.txt

          grep \
            "cats_dogs_predictions_total" \
            prometheus-metrics.txt

          echo "Prometheus metric validation passed."

      - name: Capture deployment status and logs
        if: always()
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.build-and-publish.outputs.image_latest }}

        run: |
          {
            echo "===== Docker Compose Status ====="

            docker compose \
              -f deployment/docker-compose.ci.yml \
              ps

            echo
            echo "===== Docker Compose Logs ====="

            docker compose \
              -f deployment/docker-compose.ci.yml \
              logs

          } > deployment-logs.txt 2>&1

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: deployment-evidence
          path: |
            deployment-logs.txt
            prometheus-metrics.txt
            smoke-test-output.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop temporary deployment
        if: always()
        shell: bash
        env:
          IMAGE_NAME: ${{ needs.build-and-publish.outputs.image_latest }}

        run: |
          docker compose \
            -f deployment/docker-compose.ci.yml \
            down \
            --volumes \
            --remove-orphans

  # ==========================================================
  # Optional persistent remote deployment
  # ==========================================================
  persistent-remote-deploy:
    name: Persistent Remote Deploy
    needs: deploy-and-smoke-test

    if: vars.ENABLE_REMOTE_DEPLOY == 'true'

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to configured VM through SSH
        uses: appleboy/ssh-action@v1.2.4

        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          envs: >
            IMAGE_NAME,
            GHCR_USER,
            GHCR_TOKEN,
            DEPLOY_PATH

          script_stop: true

          script: |
            set -euo pipefail

            cd "${DEPLOY_PATH}"

            echo "${GHCR_TOKEN}" |
              docker login ghcr.io \
                --username "${GHCR_USER}" \
                --password-stdin

            export IMAGE_NAME="${IMAGE_NAME}"

            docker compose \
              -f deployment/docker-compose.yml \
              pull api

            docker compose \
              -f deployment/docker-compose.yml \
              up -d \
              api \
              prometheus \
              grafana

            HEALTHY=false

            for attempt in $(seq 1 40); do
              echo "Remote health-check attempt ${attempt}/40"

              if curl \
                --fail \
                --silent \
                --show-error \
                http://localhost:8000/health; then

                HEALTHY=true
                break
              fi

              sleep 3
            done

            if [ "${HEALTHY}" != "true" ]; then
              echo "ERROR: Remote API health check failed."

              docker compose \
                -f deployment/docker-compose.yml \
                logs api

              exit 1
            fi

            PYTHONPATH=src \
              python -m cats_dogs_mlops.smoke_test \
                --base-url http://localhost:8000 \
                --image tests/assets/cat_demo.png