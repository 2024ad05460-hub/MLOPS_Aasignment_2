services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-cats-dogs-mlops:local}
    container_name: cats-dogs-api
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/model.pt
      MONITORING_DB: /app/monitoring/predictions.db
      LOG_LEVEL: INFO
    volumes:
      - ../models:/app/models:ro
      - monitoring_data:/app/monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mlflow:
    image: python:3.11-slim
    container_name: cats-dogs-mlflow
    working_dir: /mlflow
    command: >-
      sh -c "pip install --no-cache-dir mlflow==3.14.0 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: cats-dogs-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    container_name: cats-dogs-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  monitoring_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
